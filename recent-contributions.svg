<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 205" width="1180" height="205" role="img" aria-label="Recent Contributions — Satvik">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A101F"/>
      <stop offset="100%" stop-color="#070C18"/>
    </linearGradient>
    <filter id="glow3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowGreen" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="flameGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="60%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1180" height="205" rx="10"/>
    </clipPath>
  </defs>

  <!-- Card Background with Cyber Border -->
  <g clip-path="url(#cardClip)">
    <rect width="1180" height="205" fill="url(#cardGrad)"/>
    <rect width="1180" height="205" fill="none" stroke="rgba(34, 211, 238, 0.35)" stroke-width="2"/>
    
    <!-- Subtle Ambient Grid Background -->
    <g opacity="0.08" stroke="#22D3EE" stroke-width="1" stroke-dasharray="3,5">
      <line x1="0" y1="48" x2="1180" y2="48"/>
      <line x1="0" y1="125" x2="1180" y2="125"/>
      <line x1="200" y1="0" x2="200" y2="205"/>
      <line x1="980" y1="0" x2="980" y2="205"/>
    </g>
  </g>

  <!-- Cyber Corner Accents -->
  <path d="M 18 6 L 6 6 L 6 18" fill="none" stroke="#22D3EE" stroke-width="2.5" opacity="0.9"/>
  <path d="M 1162 6 L 1174 6 L 1174 18" fill="none" stroke="#22D3EE" stroke-width="2.5" opacity="0.9"/>
  <path d="M 6 187 L 6 199 L 18 199" fill="none" stroke="#22D3EE" stroke-width="2.5" opacity="0.9"/>
  <path d="M 1174 187 L 1174 199 L 1162 199" fill="none" stroke="#22D3EE" stroke-width="2.5" opacity="0.9"/>

  <!-- Top Telemetry Header -->
  <g transform="translate(32, 28)">
    <rect x="0" y="-14" width="310" height="24" rx="4" fill="rgba(34, 211, 238, 0.08)" stroke="rgba(34, 211, 238, 0.3)" stroke-width="1"/>
    <circle cx="12" cy="-2" r="3.5" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="2" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="700" fill="#22D3EE" letter-spacing="1.5">RECENT CONTRIBUTIONS // TELEMETRY</text>
  </g>

  <g transform="translate(1148, 28)">
    <circle cx="-130" cy="-2" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="-118" y="2" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="700" fill="#10B981" letter-spacing="1">LIVE ON GITHUB</text>
  </g>

  <line x1="32" y1="48" x2="1148" y2="48" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Column Dividers -->
  <g stroke="rgba(34, 211, 238, 0.22)" stroke-width="1">
    <line x1="393" y1="62" x2="393" y2="185" stroke-dasharray="3,4"/>
    <line x1="787" y1="62" x2="787" y2="185" stroke-dasharray="3,4"/>
  </g>

  <!-- ==================== COLUMN 1: TOTAL CONTRIBUTIONS ==================== -->
  <g transform="translate(196, 0)">
    <!-- Big Number -->
    <text x="0" y="110" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#F8FAFC" letter-spacing="1">92</text>
    
    <!-- Title Label -->
    <text x="0" y="142" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="700" fill="#22D3EE" letter-spacing="1.5">TOTAL CONTRIBUTIONS</text>
    
    <!-- Date Range Subtitle -->
    <text x="0" y="166" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="500" fill="#64748B" letter-spacing="0.5">Nov 15, 2024 – Present</text>
  </g>

  <!-- ==================== COLUMN 2: CURRENT STREAK (CENTERPIECE) ==================== -->
  <g transform="translate(590, 0)">
    <!-- Center Ring Ambient Backdrop -->
    <circle cx="0" cy="98" r="40" fill="rgba(16, 185, 129, 0.05)"/>

    <!-- Glowing Outer Pulse Ring -->
    <circle cx="0" cy="98" r="38" fill="none" stroke="rgba(167, 139, 250, 0.25)" stroke-width="3.5"/>
    <circle cx="0" cy="98" r="38" fill="none" stroke="#10B981" stroke-width="3.5" stroke-dasharray="60 180" stroke-linecap="round" filter="url(#glow3)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 98" to="360 0 98" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- Flame Icon above the number -->
    <g transform="translate(-10, 52)">
      <path d="M 10 0 C 10 0 14 6 14 10 C 14 13.5 11.5 16 8 16 C 4.5 16 2 13.5 2 10 L 2.1 9.2 C 0.2 11.7 -1 14.5 -1 17.5 C -1 22 2.5 25.5 7 25.5 C 11.5 25.5 15 22 15 17.5 C 15 12 12.5 7.5 10 0 Z" fill="url(#flameGrad)" filter="url(#glowGreen)"/>
    </g>

    <!-- Big Number -->
    <text x="0" y="110" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#F8FAFC" letter-spacing="1">2</text>
    
    <!-- Title Label -->
    <text x="0" y="142" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="800" fill="#10B981" letter-spacing="1.5">CURRENT STREAK</text>
    
    <!-- Date Range Subtitle -->
    <text x="0" y="166" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="600" fill="#34D399" letter-spacing="0.5">Active Streak • Continuous</text>
  </g>

  <!-- ==================== COLUMN 3: LONGEST STREAK ==================== -->
  <g transform="translate(984, 0)">
    <!-- Big Number -->
    <text x="0" y="110" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#F8FAFC" letter-spacing="1">4</text>
    
    <!-- Title Label -->
    <text x="0" y="142" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="700" fill="#A78BFA" letter-spacing="1.5">LONGEST STREAK</text>
    
    <!-- Date Range Subtitle -->
    <text x="0" y="166" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="500" fill="#64748B" letter-spacing="0.5">Jun 4 – Jun 7</text>
  </g>
</svg>
