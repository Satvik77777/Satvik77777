<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="240" viewBox="0 0 1100 240" role="img" aria-label="Illustrative request pipeline: interface, API, validation, database"><title>Illustrative request pipeline: interface, API, validation, database</title><style>:root{--bg:#f8fafc;--panel:#edf3f6;--ink:#172839;--muted:#53697b;--line:#cbdbe5;--accent:#007c91;--bright:#b65b13}text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace;letter-spacing:1.5px}.moving{transform:translateX(0)}@keyframes packet{to{offset-distance:100%}}.pulse{animation:pulse 3s ease-in-out infinite}.blink{animation:blink 1.3s steps(2) infinite}.scan{animation:scan 8s linear infinite}@keyframes pulse{50%{opacity:.35}}@keyframes blink{50%{opacity:0}}@keyframes scan{to{stroke-dashoffset:-250}}@keyframes packet-travel{to{transform:translateX(801px)}}@media(prefers-reduced-motion:reduce){.moving{animation:none}.moving,.snake,.scan,.pulse,.blink{animation:none!important}.day{animation:none!important}}</style><rect x="1" y="1" width="1098" height="238" rx="16" fill="#f8fafc" stroke="#cbdbe5"/><text x="28" y="33" font-size="10" fill="#53697b" class="mono">HOW I THINK ABOUT A REQUEST</text><rect x="35" y="64" width="229" height="76" rx="10" fill="#edf3f6" stroke="#cbdbe5"/><text x="149" y="99" font-size="12" fill="#172839" text-anchor="middle" class="mono">INTERFACE</text><text x="149" y="120" font-size="10" fill="#007c91" text-anchor="middle">React</text><path d="M149 140V174" stroke="#cbdbe5"/><rect x="302" y="64" width="229" height="76" rx="10" fill="#edf3f6" stroke="#cbdbe5"/><text x="416" y="99" font-size="12" fill="#172839" text-anchor="middle" class="mono">API</text><text x="416" y="120" font-size="10" fill="#007c91" text-anchor="middle">Express</text><path d="M416 140V174" stroke="#cbdbe5"/><rect x="569" y="64" width="229" height="76" rx="10" fill="#edf3f6" stroke="#cbdbe5"/><text x="683" y="99" font-size="12" fill="#172839" text-anchor="middle" class="mono">VALIDATION</text><text x="683" y="120" font-size="10" fill="#007c91" text-anchor="middle">Zod</text><path d="M683 140V174" stroke="#cbdbe5"/><rect x="836" y="64" width="229" height="76" rx="10" fill="#edf3f6" stroke="#cbdbe5"/><text x="950" y="99" font-size="12" fill="#172839" text-anchor="middle" class="mono">DATABASE</text><text x="950" y="120" font-size="10" fill="#007c91" text-anchor="middle">MongoDB</text><path d="M950 140V174" stroke="#cbdbe5"/><path d="M149 174H950" fill="none" stroke="#007c91" stroke-width="2" opacity=".35"/><g id="pipeline-packet"><circle class="moving" cx="149" cy="174" r="7" fill="#b65b13" style="animation:packet-travel 5s linear infinite"/></g><text x="28" y="218" font-size="10" fill="#53697b" class="mono">REQUEST → RESPONSE  /  SMALL DETAILS, CONNECTED</text></svg>