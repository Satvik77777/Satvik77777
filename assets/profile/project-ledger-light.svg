<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-label="Ledger architecture illustration: debit and credit in an atomic transaction"><title>Ledger architecture illustration: debit and credit in an atomic transaction</title><style>:root{--bg:#f8fafc;--panel:#edf3f6;--ink:#172839;--muted:#53697b;--line:#cbdbe5;--accent:#007c91;--bright:#b65b13}text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace;letter-spacing:1.5px}.moving{transform:translateX(0)}@keyframes packet{to{offset-distance:100%}}.pulse{animation:pulse 3s ease-in-out infinite}.blink{animation:blink 1.3s steps(2) infinite}.scan{animation:scan 8s linear infinite}@keyframes pulse{50%{opacity:.35}}@keyframes blink{50%{opacity:0}}@keyframes scan{to{stroke-dashoffset:-250}}@keyframes packet-travel{to{transform:translateX(801px)}}@media(prefers-reduced-motion:reduce){.moving{animation:none}.moving,.snake,.scan,.pulse,.blink{animation:none!important}.day{animation:none!important}}</style><rect x="1" y="1" width="1098" height="218" rx="16" fill="#f8fafc" stroke="#cbdbe5"/><text x="29" y="33" font-size="10" fill="#007c91" class="mono">PROJECT BLUEPRINT / DOUBLE-ENTRY LEDGER</text><rect x="29" y="66" width="215" height="85" rx="10" fill="#edf3f6" stroke="#cbdbe5"/><text x="46" y="94" font-size="10" fill="#007c91" class="mono">REQUEST</text><text x="46" y="128" font-size="15" fill="#172839" >Unique transaction key</text><text x="263" y="115" font-size="20" fill="#53697b" >→</text><rect x="300" y="52" width="460" height="114" rx="12" fill="#edf3f6" stroke="#007c91"/><text x="319" y="77" font-size="10" fill="#007c91" class="mono">ONE ATOMIC TRANSACTION</text><rect x="318" y="90" width="187" height="54" rx="10" fill="#f8fafc" stroke="#cbdbe5"/><text x="338" y="123" font-size="16" fill="#172839" >Debit  − amount</text><text x="522" y="124" font-size="24" fill="#007c91" >⇄</text><rect x="558" y="90" width="184" height="54" rx="10" fill="#f8fafc" stroke="#cbdbe5"/><text x="576" y="123" font-size="16" fill="#172839" >Credit  + amount</text><text x="779" y="115" font-size="20" fill="#53697b" >→</text><rect x="819" y="66" width="252" height="85" rx="10" fill="#edf3f6" stroke="#cbdbe5"/><text x="837" y="94" font-size="10" fill="#007c91" class="mono">APPEND-ONLY LEDGER</text><text x="837" y="128" font-size="16" fill="#172839" >Balance from entries</text><text x="29" y="198" font-size="10" fill="#53697b" class="mono">CONSISTENT TRANSFERS · IDEMPOTENT RETRIES · TRACEABLE ENTRIES</text><path d="M300 169H760" stroke="#b65b13" stroke-width="2" stroke-dasharray="35 100" class="scan"/></svg>