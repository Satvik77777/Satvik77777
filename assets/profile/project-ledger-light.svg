<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-label="Ledger architecture illustration: debit and credit in an atomic transaction"><title>Ledger architecture illustration: debit and credit in an atomic transaction</title><style>:root{--bg:#fffdf9;--panel:#f6f0e6;--ink:#242a30;--muted:#667079;--line:#ded7cb;--accent:#a64f19;--bright:#d98e44}text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace;letter-spacing:1.5px}.moving{offset-path:path('M 160 93 H 940');offset-distance:0%;animation:packet 7s linear infinite}@keyframes packet{to{offset-distance:100%}}@media(prefers-reduced-motion:reduce){.moving{animation:none}.moving,.snake{display:none}.day{animation:none!important}}</style><rect x="1" y="1" width="1098" height="218" rx="16" fill="#fffdf9" stroke="#ded7cb"/><text x="29" y="33" font-size="10" fill="#a64f19" class="mono">PROJECT BLUEPRINT / DOUBLE-ENTRY LEDGER</text><rect x="29" y="66" width="215" height="85" rx="10" fill="#f6f0e6" stroke="#ded7cb"/><text x="46" y="94" font-size="10" fill="#a64f19" class="mono">REQUEST</text><text x="46" y="128" font-size="15" fill="#242a30" >Unique transaction key</text><text x="263" y="115" font-size="20" fill="#667079" >→</text><rect x="300" y="52" width="460" height="114" rx="12" fill="#f6f0e6" stroke="#a64f19"/><text x="319" y="77" font-size="10" fill="#a64f19" class="mono">ONE ATOMIC TRANSACTION</text><rect x="318" y="90" width="187" height="54" rx="10" fill="#fffdf9" stroke="#ded7cb"/><text x="338" y="123" font-size="16" fill="#242a30" >Debit  − amount</text><text x="522" y="124" font-size="24" fill="#a64f19" >⇄</text><rect x="558" y="90" width="184" height="54" rx="10" fill="#fffdf9" stroke="#ded7cb"/><text x="576" y="123" font-size="16" fill="#242a30" >Credit  + amount</text><text x="779" y="115" font-size="20" fill="#667079" >→</text><rect x="819" y="66" width="252" height="85" rx="10" fill="#f6f0e6" stroke="#ded7cb"/><text x="837" y="94" font-size="10" fill="#a64f19" class="mono">APPEND-ONLY LEDGER</text><text x="837" y="128" font-size="16" fill="#242a30" >Balance from entries</text><text x="29" y="198" font-size="10" fill="#667079" class="mono">CONSISTENT TRANSFERS · IDEMPOTENT RETRIES · TRACEABLE ENTRIES</text></svg>