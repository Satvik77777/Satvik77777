<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-label="AI project architecture illustration"><title>AI project architecture illustration</title><style>:root{--bg:#f8fafc;--panel:#edf3f6;--ink:#172839;--muted:#53697b;--line:#cbdbe5;--accent:#007c91;--bright:#b65b13}text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace;letter-spacing:1.5px}.moving{transform:translateX(0)}@keyframes packet{to{offset-distance:100%}}.pulse{animation:pulse 3s ease-in-out infinite}.blink{animation:blink 1.3s steps(2) infinite}.scan{animation:scan 8s linear infinite}@keyframes pulse{50%{opacity:.35}}@keyframes blink{50%{opacity:0}}@keyframes scan{to{stroke-dashoffset:-250}}@keyframes packet-travel{to{transform:translateX(801px)}}</style><rect x="1" y="1" width="1098" height="218" rx="16" fill="#f8fafc" stroke="#cbdbe5"/><text x="29" y="33" font-size="10" fill="#007c91" class="mono">PROJECT BLUEPRINT / AI CAREER TOOLS</text><rect x="29" y="62" width="240" height="100" rx="10" fill="#edf3f6" stroke="#cbdbe5"/><text x="46" y="91" font-size="10" fill="#007c91" class="mono">INPUT</text><text x="46" y="125" font-size="13" fill="#172839" >Résumé + job description</text><text x="281" y="119" font-size="18" fill="#53697b" text-anchor="middle">→</text><rect x="296" y="62" width="240" height="100" rx="10" fill="#edf3f6" stroke="#cbdbe5"/><text x="313" y="91" font-size="10" fill="#007c91" class="mono">GEMINI</text><text x="313" y="125" font-size="13" fill="#172839" >Questions + preparation plan</text><text x="548" y="119" font-size="18" fill="#53697b" text-anchor="middle">→</text><rect x="563" y="62" width="240" height="100" rx="10" fill="#edf3f6" stroke="#cbdbe5"/><text x="580" y="91" font-size="10" fill="#007c91" class="mono">ZOD</text><text x="580" y="125" font-size="13" fill="#172839" >Validated structured output</text><text x="815" y="119" font-size="18" fill="#53697b" text-anchor="middle">→</text><rect x="830" y="