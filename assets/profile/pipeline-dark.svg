<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="180" viewBox="0 0 1100 180" role="img" aria-label="Illustrative request pipeline: interface, API, validation, database"><title>Illustrative request pipeline: interface, API, validation, database</title><style>:root{--bg:#151a20;--panel:#1d252d;--ink:#e9edf0;--muted:#a0acb7;--line:#34414c;--accent:#e8ad6b;--bright:#f0c88f}text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace;letter-spacing:1.5px}.moving{offset-path:path('M 160 93 H 940');offset-distance:0%;animation:packet 7s linear infinite}@keyframes packet{to{offset-distance:100%}}@media(prefers-reduced-motion:reduce){.moving{animation:none}.snake{display:none}.day{animation:none!important}}</style><rect x="1" y="1" width="1098" height="178" rx="16" fill="#151a20" stroke="#34414c"/><text x="28" y="33" font-size="10" fill="#a0acb7" class="mono">HOW I THINK ABOUT A REQUEST</text><path d="M160 93H940" fill="none" stroke="#34414c" stroke-width="2"/><circle class="moving" cx="160" cy="93" r="5" fill="#e8ad6b" style="offset-path:none;animation:none"><animateMotion path="M0 0H780" dur="7s" repeatCount="indefinite"/></circle><rect x="35" y="64" width="229" height="61" rx="10" fill="#1d252d" stroke="#34414c"/><text x="149" y="101" font-size="12" fill="#e9edf0" text-anchor="middle" class="mono">INTERFACE</text><rect x="302" y="64" width="229" height="61" rx="10" fill="#1d252d" stroke="#34414c"/><text x="416" y="101" font-size="12" fill="#e9edf0" text-anchor="middle" class="mono">API</text><rect x="569" y="64" width="229" height="61" rx="10" fill="#1d252d" stroke="#34414c"/><text x="683" y="101" font-size="12" fill="#e9edf0" text-anchor="middle" class="mono">VALIDATION</text><rect x="836" y="64" width="229" height="61" rx="10" fill="#1d252d" stroke="#34414c"/><text x="950" y="101" font-size="12" fill="#e9edf0" text-anchor="middle" class="mono">DATABASE</text><text x="28" y="157" font-size="10" fill="#a0acb7" >From a user’s action to a reliable response.</text></svg>