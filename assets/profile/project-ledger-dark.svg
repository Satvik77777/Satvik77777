<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-label="Ledger architecture illustration: debit and credit in an atomic transaction"><title>Ledger architecture illustration: debit and credit in an atomic transaction</title><style>:root{--bg:#151a20;--panel:#1d252d;--ink:#e9edf0;--muted:#a0acb7;--line:#34414c;--accent:#e8ad6b;--bright:#f0c88f}text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace;letter-spacing:1.5px}.moving{offset-path:path('M 160 93 H 940');offset-distance:0%;animation:packet 7s linear infinite}@keyframes packet{to{offset-distance:100%}}@media(prefers-reduced-motion:reduce){.moving{animation:none}.moving,.snake{display:none}.day{animation:none!important}}</style><rect x="1" y="1" width="1098" height="218" rx="16" fill="#151a20" stroke="#34414c"/><text x="29" y="33" font-size="10" fill="#e8ad6b" class="mono">PROJECT BLUEPRINT / DOUBLE-ENTRY LEDGER</text><rect x="29" y="66" width="215" height="85" rx="10" fill="#1d252d" stroke="#34414c"/><text x="46" y="94" font-size="10" fill="#e8ad6b" class="mono">REQUEST</text><text x="46" y="128" font-size="15" fill="#e9edf0" >Unique transaction key</text><text x="263" y="115" font-size="20" fill="#a0acb7" >→</text><rect x="300" y="52" width="460" height="114" rx="12" fill="#1d252d" stroke="#e8ad6b"/><text x="319" y="77" font-size="10" fill="#e8ad6b" class="mono">ONE ATOMIC TRANSACTION</text><rect x="318" y="90" width="187" height="54" rx="10" fill="#151a20" stroke="#34414c"/><text x="338" y="123" font-size="16" fill="#e9edf0" >Debit  − amount</text><text x="522" y="124" font-size="24" fill="#e8ad6b" >⇄</text><rect x="558" y="90" width="184" height="54" rx="10" fill="#151a20" stroke="#34414c"/><text x="576" y="123" font-size="16" fill="#e9edf0" >Credit  + amount</text><text x="779" y="115" font-size="20" fill="#a0acb7" >→</text><rect x="819" y="66" width="252" height="85" rx="10" fill="#1d252d" stroke="#34414c"/><text x="837" y="94" font-size="10" fill="#e8ad6b" class="mono">APPEND-ONLY LEDGER</text><text x="837" y="128" font-size="16" fill="#e9edf0" >Balance from entries</text><text x="29" y="198" font-size="10" fill="#a0acb7" class="mono">CONSISTENT TRANSFERS · IDEMPOTENT RETRIES · TRACEABLE ENTRIES</text></svg>