<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 236" width="850" height="236">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <filter id="radarGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #F0F6FC; }
    .sub-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 500; fill: #C9D1D9; }
    .repo-link { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 600; fill: #58A6FF; text-decoration: none; }
    .repo-link:hover { text-decoration: underline; fill: #79C0FF; }
    .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13.5px; fill: #8B949E; font-weight: 400; }
    .radar-pct { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #F0F6FC; }
    .radar-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: #8B949E; }
  </style>

  <!-- Card Background -->
  <rect width="850" height="236" rx="10" fill="url(#cardBg)" stroke="#30363D" stroke-width="1.2"/>

  <!-- Top Organization Pill: ONLY @accordproject per user specification -->
  <g transform="translate(32, 22)">
    <rect width="174" height="34" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
    
    <!-- Accord Project stylized Logo -->
    <g transform="translate(9, 6)">
      <rect width="22" height="22" rx="4.5" fill="#1D2A44" stroke="#2563EB" stroke-width="1"/>
      <path d="M5.5 17 L11 4.5 L16.5 17 Z" fill="none" stroke="#60A5FA" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      <line x1="7.5" y1="13" x2="14.5" y2="13" stroke="#93C5FD" stroke-width="2"/>
    </g>
    
    <text x="39" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F0F6FC">@accordproject</text>
  </g>

  <!-- Left: Activity overview & Contributed to Section -->
  <g transform="translate(32, 82)">
    <text x="0" y="4" class="card-title">Activity overview</text>
    
    <!-- Contributed to header with crisp vector book icon -->
    <g transform="translate(0, 26)">
      <!-- Book Repo Icon -->
      <g transform="translate(0, -1)">
        <rect x="0.8" y="0.8" width="14.4" height="14.4" rx="2" fill="none" stroke="#8B949E" stroke-width="1.6"/>
        <line x1="4.8" y1="1" x2="4.8" y2="15" stroke="#8B949E" stroke-width="1.5"/>
        <path d="M8 1 L8 6.5 L10.5 4.8 L13 6.5 L13 1" fill="#8B949E"/>
      </g>
      <text x="24" y="12" class="sub-title">Contributed to</text>
      
      <!-- Repositories specified by user -->
      <g transform="translate(24, 38)">
        <!-- accordproject/template-playground -->
        <a href="https://github.com/accordproject/template-playground" target="_blank">
          <text x="0" y="0" class="repo-link">accordproject/template-playground<tspan class="text-muted"> ,</tspan></text>
        </a>
        
        <!-- accordproject/apap and other repositories -->
        <g transform="translate(0, 25)">
          <a href="https://github.com/accordproject/apap" target="_blank">
            <text x="0" y="0" class="repo-link">accordproject/apap <tspan class="text-muted">and other repositories</tspan></text>
          </a>
        </g>
      </g>
    </g>
  </g>

  <!-- Middle Divider Line -->
  <line x1="435" y1="20" x2="435" y2="216" stroke="#30363D" stroke-width="1"/>

  <!-- Right: Activity Breakdown 4-Axis Radar Chart -->
  <g transform="translate(0, 0)">
    <!-- 4 Axes lines (GitHub Vibrant Green #2EA043) -->
    <g stroke="#2EA043" stroke-width="1.8" stroke-linecap="round">
      <!-- Horizontal axis: Commits <-> Issues -->
      <line x1="579" y1="118" x2="711" y2="118"/>
      <!-- Vertical axis: Code Review <-> Pull Requests -->
      <line x1="645" y1="52" x2="645" y2="184"/>
    </g>

    <!-- Radar Area Polygon with Glowing Shade -->
    <polygon points="645.0,114.0 649.0,118.0 645.0,127.2 582.3,118.0" fill="rgba(46, 160, 67, 0.45)" stroke="#3FB950" stroke-width="2.2" filter="url(#radarGlow)"/>

    <!-- Vertex Points with White Outer Ring & Green Center -->
    <circle cx="645.0" cy="114.0" r="3.5" fill="#3FB950" stroke="#FFFFFF" stroke-width="1.4"/>
    <circle cx="645.0" cy="127.2" r="3.5" fill="#3FB950" stroke="#FFFFFF" stroke-width="1.4"/>
    <circle cx="582.3" cy="118.0" r="4" fill="#3FB950" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="649.0" cy="118.0" r="3.5" fill="#3FB950" stroke="#FFFFFF" stroke-width="1.4"/>

    <!-- Axis Labels -->
    <!-- Top: Code review (1%) -->
    <g transform="translate(645, 44)" text-anchor="middle">
      <text y="-11" class="radar-pct">1%</text>
      <text y="2" class="radar-label">Code review</text>
    </g>

    <!-- Bottom: Pull requests (3%) -->
    <g transform="translate(645, 200)" text-anchor="middle">
      <text y="0" class="radar-pct">3%</text>
      <text y="14" class="radar-label">Pull requests</text>
    </g>

    <!-- Left: Commits (95%) -->
    <g transform="translate(569, 118)" text-anchor="end">
      <text y="-4" class="radar-pct">95%</text>
      <text y="10" class="radar-label">Commits</text>
    </g>

    <!-- Right: Issues (1%) -->
    <g transform="translate(721, 118)" text-anchor="start">
      <text y="-4" class="radar-pct">1%</text>
      <text y="10" class="radar-label">Issues</text>
    </g>
  </g>
</svg>